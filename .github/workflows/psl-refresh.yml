name: Weekly PSL refresh

on:
  schedule:
    # Mondays at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh public_suffix_list.dat
    # Linux: 10x cheaper than macOS, and this workflow is platform-agnostic
    # (Foundation URLSession + Swift Testing + XCTest measure).
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Show Swift version
        run: swift --version

      - name: Refresh PSL from publicsuffix.org
        run: swift script/UpdatePSL.swift

      - name: Verify tests still pass
        run: swift test

      - name: Open PR if PSL changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: psl-refresh
          base: develop
          delete-branch: true
          title: 'chore(psl): weekly refresh'
          commit-message: 'data: refresh public_suffix_list.dat from publicsuffix.org'
          body: |
            Weekly automated refresh of the bundled Public Suffix List.

            Source: https://publicsuffix.org/list/public_suffix_list.dat
            Normalized by `swift script/UpdatePSL.swift` (strip comments, sort
            by descending label count).

            Tests passed before opening this PR. The `Tests` workflow will
            re-run on the PR to confirm.
          labels: |
            automated
            psl
